spring:
  application:
    name: micromarket

  datasource:
    url: ${DB_URL:jdbc:h2:mem:micromarket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}

  sql:
    init:
      mode: always # Esto ejecutará tu archivo data.sql al arrancar

# Configuración del servidor
server:
  port: 8080
  error:
    include-message: always