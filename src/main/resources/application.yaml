spring:
  application:
    name: micromarket

  datasource:
    url: ${DB_URL:jdbc:h2:mem:micromarket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    # Para usar MySQL, descomenta las líneas de abajo o usa Variables de Entorno:
    # url: jdbc:mysql://localhost:3306/micro_market_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    # username: root
    # password: 
    # driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always # Esto ejecutará tu archivo data.sql al arrancar

# Configuración del servidor
server:
  port: 8080
  error:
    include-message: always